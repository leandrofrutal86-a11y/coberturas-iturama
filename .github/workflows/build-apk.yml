name: Gerar APK - Equipe Iturama

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Criar projeto Android
        shell: bash
        run: |
          set -e
          rm -rf android
          mkdir -p android/app/src/main/java/com/equipeiturama/coberturas
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/assets

          cp index.html android/app/src/main/assets/index.html

          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='Equipe Iturama App'
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.equipeiturama.coberturas'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.equipeiturama.coberturas'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:icon="@drawable/splash_logo"
                  android:roundIcon="@drawable/splash_logo"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="app_red">#D71920</color>
              <color name="app_red_dark">#B70E14</color>
              <color name="app_dark">#161616</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Equipe Iturama</string>
          </resources>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#D71920</item>
                  <item name="android:navigationBarColor">#161616</item>
                  <item name="android:statusBarColor">#B70E14</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/res/drawable/splash_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="120dp" android:height="120dp" android:viewportWidth="120" android:viewportHeight="120">
              <path android:fillColor="#FFFFFF" android:pathData="M60,4A56,56 0,1 0,60 116A56,56 0,1 0,60 4"/>
              <path android:fillColor="#D71920" android:pathData="M29,31h62v58h-62z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M39,45h42v8h-42zM39,58h42v8h-42zM39,71h28v8h-28z"/>
          </vector>
          EOF

          cat > android/app/src/main/java/com/equipeiturama/coberturas/MainActivity.java <<'EOF'
          package com.equipeiturama.coberturas;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.view.Gravity;
          import android.view.View;
          import android.view.Window;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private static final String REMOTE_URL = "https://leandrofrutal86-a11y.github.io/coberturas-iturama/";
              private WebView webView;
              private View splash;
              private boolean remoteFailed = false;

              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window w = getWindow();
                  w.setStatusBarColor(Color.rgb(183,14,20));
                  w.setNavigationBarColor(Color.rgb(22,22,22));
                  showSplash();

                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setSupportZoom(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleUrl(request.getUrl());
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleUrl(Uri.parse(url));
                      }
                      @Override public void onPageFinished(WebView view, String url) {
                          if (splash != null) new Handler().postDelayed(() -> hideSplash(), 250);
                      }
                      @Override public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame() && !remoteFailed) {
                              remoteFailed = true;
                              view.loadUrl("file:///android_asset/index.html");
                          }
                      }
                  });

                  setContentView(webView);
                  new Handler().postDelayed(() -> {
                      if (!remoteFailed) webView.loadUrl(REMOTE_URL);
                  }, 850);
              }

              private boolean handleUrl(Uri u) {
                  String scheme = u.getScheme();
                  if (scheme == null) return false;
                  if ("tel".equalsIgnoreCase(scheme) || "mailto".equalsIgnoreCase(scheme)) {
                      try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) {}
                      return true;
                  }
                  if ("http".equalsIgnoreCase(scheme) || "https".equalsIgnoreCase(scheme)) {
                      String host = u.getHost();
                      if (host != null && host.endsWith("github.io")) return false;
                      try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception ignored) {}
                      return true;
                  }
                  return false;
              }

              private void showSplash() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER);
                  box.setBackgroundColor(Color.rgb(215,25,32));
                  box.setPadding(32,32,32,32);

                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.splash_logo);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(130,130);
                  lp.bottomMargin = 24;
                  box.addView(logo, lp);

                  TextView title = new TextView(this);
                  title.setText("EQUIPE ITURAMA");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(25);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  box.addView(title, new LinearLayout.LayoutParams(-1,-2));

                  TextView sub = new TextView(this);
                  sub.setText("Coberturas e Gestão Comercial");
                  sub.setTextColor(Color.WHITE);
                  sub.setAlpha(.9f);
                  sub.setTextSize(14);
                  sub.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams sp = new LinearLayout.LayoutParams(-1,-2);
                  sp.topMargin = 6;
                  box.addView(sub, sp);

                  ProgressBar progress = new ProgressBar(this);
                  LinearLayout.LayoutParams pp = new LinearLayout.LayoutParams(42,42);
                  pp.topMargin = 28;
                  box.addView(progress, pp);
                  splash = box;
                  setContentView(splash);
              }

              private void hideSplash() {
                  if (splash != null) {
                      splash.animate().alpha(0f).setDuration(220).withEndAction(() -> {
                          splash.setVisibility(View.GONE);
                          splash = null;
                      }).start();
                  }
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }
          }
          EOF

          cd android
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: equipe-iturama-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
