name: Build sales import data
on:
  push:
    paths:
      - 'data/import-20260907-0*.txt'
      - '.github/workflows/build-sales-import.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build JSON
        run: |
          cat data/import-20260907-0*.txt | tr -d '\n\r ' > /tmp/data.b64
          base64 -d /tmp/data.b64 | gzip -d > data/import-20260907.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import-20260907.json
          git commit -m "Gera dados de vendas 07/09/2026" || exit 0
          git push
