name: Cleanup Competing Fixes
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove scripts concorrentes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'\s*<script\s+src=["\'](?:trio-fix|heineken-fix)\.js(?:\?[^"\']*)?["\']\s*></script>', '', s, flags=re.I)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove arquivos e workflows antigos
        run: |
          rm -f trio-fix.js heineken-fix.js
          rm -f .github/workflows/inject-trio-fix.yml .github/workflows/inject-heineken-fix.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Remove correcoes concorrentes e estabiliza renderizacao'
          git push
