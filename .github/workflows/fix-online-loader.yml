name: Fix online sales loader
on:
  push:
    paths:
      - '.github/workflows/fix-online-loader.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Supabase ordering
        run: |
          python - <<'PY'
          p='supabase-online.js'
          s=open(p,encoding='utf-8').read()
          s=s.replace('&order=id.asc','')
          s=s.replace('/* Correcao final ADM + metas zeradas + sincronizacao online */','/* Base de vendas atualizada em 07/09/2026 + parametros de categorias */')
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-online.js
          git commit -m "Atualiza carregamento da base de vendas 07/09/2026" || exit 0
          git push
