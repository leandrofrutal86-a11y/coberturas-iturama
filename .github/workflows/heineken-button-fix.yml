name: Corrigir botao Heineken

on:
  push:
    paths:
      - 'heineken-fix-trigger.txt'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir nome e destino do botao Heineken
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          antigo='<button class="q hei" onclick="choose(\'COBERTURA HEINEKEN\')">★ Cervejas Heineken</button>'
          novo='<button class="q hei" onclick="choose(\'COBERTURA CERVEJA GERAL (HEINEKEN)\')">★ Cobertura Cerveja Geral (Heineken)</button>'
          if antigo not in s:
              raise SystemExit('Botao Heineken atual nao encontrado')
          s=s.replace(antigo,novo,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          if "choose('COBERTURA CERVEJA GERAL (HEINEKEN)')" not in s:
              raise SystemExit('Destino novo nao encontrado')
          if '★ Cobertura Cerveja Geral (Heineken)' not in s:
              raise SystemExit('Nome novo nao encontrado')
          print('OK')
          PY
      - name: Publicar
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Corrigir botao Cobertura Cerveja Geral Heineken' && git push)
