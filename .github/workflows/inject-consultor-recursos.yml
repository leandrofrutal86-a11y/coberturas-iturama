name: Restaura materiais e telefones
on:
  push:
    branches: [main]
    paths:
      - 'consultor-recursos.js'
      - 'consultor-login-mobile-fix.js'
      - '.github/workflows/inject-consultor-recursos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Injetar scripts do consultor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src="consultor-recursos\.js\?v=[^"]+"></script>','',s)
          s=re.sub(r'<script src="consultor-login-mobile-fix\.js\?v=[^"]+"></script>','',s)
          tags=(
            '<script src="consultor-recursos.js?v=20260909-01"></script>'
            '<script src="consultor-login-mobile-fix.js?v=20260909-01"></script>'
          )
          s=s.replace('</body>',tags+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Ajusta login mobile do consultor"
          git push