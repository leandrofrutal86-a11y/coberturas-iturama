name: Inject Consultor Visitas
on:
  push:
    branches: [main]
    paths:
      - 'consultor-visitas.js'
      - 'consultor-contatos.js'
      - 'consultor-layout-clean.js'
      - 'consultor-header-actions.js'
      - 'consultor-bottom-menu.js'
      - 'consultor-acesso-geral.js'
      - 'b2b-dashboard-fix.js'
      - 'consultor-results-style.js'
      - 'consultor-pv-dia.js'
      - 'consultor-imperdoaveis.js'
      - 'consultor-imperdoaveis-ajuste.js'
      - 'consultor-mobile-fit.js'
      - 'consultor-trio-labels.js'
      - 'footer-credit.js'
      - '.github/workflows/inject-consultor-visitas.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          for name in ['consultor-visitas','consultor-contatos','consultor-layout-clean','consultor-header-actions','consultor-bottom-menu','consultor-acesso-geral','b2b-dashboard-fix','consultor-results-style','consultor-pv-dia','consultor-imperdoaveis','consultor-imperdoaveis-ajuste','consultor-mobile-fit','consultor-trio-labels','footer-credit']:
              s=re.sub(r'<script src="'+re.escape(name)+r'\.js\?v=[^"]+"></script>','',s)
          tags=(
            '<script src="consultor-visitas.js?v=20260914-acomp-05"></script>'
            '<script src="consultor-contatos.js?v=20260914-acomp-05"></script>'
            '<script src="consultor-layout-clean.js?v=20260909-01"></script>'
            '<script src="consultor-header-actions.js?v=20260914-rogerio-01"></script>'
            '<script src="consultor-bottom-menu.js?v=20260910-bottom-02"></script>'
            '<script src="b2b-dashboard-fix.js?v=20260914-acomp-02"></script>'
            '<script src="consultor-results-style.js?v=20260911-results-02"></script>'
            '<script src="consultor-pv-dia.js?v=20260914-acomp-05"></script>'
            '<script src="consultor-imperdoaveis.js?v=20260914-acomp-05"></script>'
            '<script src="consultor-imperdoaveis-ajuste.js?v=20260914-acomp-05"></script>'
            '<script src="consultor-mobile-fit.js?v=20260914-mobile-10"></script>'
            '<script src="consultor-trio-labels.js?v=20260911-trio-01"></script>'
            '<script src="footer-credit.js?v=20260911-credit-01"></script>'
            '<script src="consultor-acesso-geral.js?v=20260914-acomp-10"></script>'
          )
          s=s.replace('</body></html>',tags+'</body></html>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push safely
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'Atualiza painel dos consultores'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Tentativa $attempt falhou; aguardando para tentar novamente..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
