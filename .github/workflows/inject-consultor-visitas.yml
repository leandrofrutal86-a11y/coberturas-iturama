name: Inject Consultor Visitas
on:
  push:
    branches: [main]
    paths:
      - 'consultor-visitas.js'
      - 'consultor-layout-clean.js'
      - 'consultor-header-actions.js'
      - 'consultor-bottom-menu.js'
      - 'b2b-dashboard-fix.js'
      - 'consultor-results-style.js'
      - 'consultor-pv-dia.js'
      - 'consultor-imperdoaveis.js'
      - 'consultor-imperdoaveis-ajuste.js'
      - 'consultor-mobile-fit.js'
      - '.github/workflows/inject-consultor-visitas.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          for name in ['consultor-visitas','consultor-layout-clean','consultor-header-actions','consultor-bottom-menu','b2b-dashboard-fix','consultor-results-style','consultor-pv-dia','consultor-imperdoaveis','consultor-imperdoaveis-ajuste','consultor-mobile-fit']:
              s=re.sub(r'<script src="'+re.escape(name)+r'\.js\?v=[^"]+"></script>','',s)
          tags=(
            '<script src="consultor-visitas.js?v=20260909-05"></script>'
            '<script src="consultor-layout-clean.js?v=20260909-01"></script>'
            '<script src="consultor-header-actions.js?v=20260910-03"></script>'
            '<script src="consultor-bottom-menu.js?v=20260910-bottom-02"></script>'
            '<script src="b2b-dashboard-fix.js?v=20260910-b2b-03"></script>'
            '<script src="consultor-results-style.js?v=20260910-results-01"></script>'
            '<script src="consultor-pv-dia.js?v=20260910-pvdia-02"></script>'
            '<script src="consultor-imperdoaveis.js?v=20260910-imp-04"></script>'
            '<script src="consultor-imperdoaveis-ajuste.js?v=20260910-imp-pv-03"></script>'
            '<script src="consultor-mobile-fit.js?v=20260911-mobile-03"></script>'
          )
          s=s.replace('</body></html>',tags+'</body></html>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Atualiza tabela PV compacta' && git push)
