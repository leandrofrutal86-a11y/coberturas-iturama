name: Inject Consultor Visitas
on:
  push:
    branches: [main]
    paths:
      - 'consultor-visitas.js'
      - 'consultor-layout-clean.js'
      - 'consultor-header-actions.js'
      - '.github/workflows/inject-consultor-visitas.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'<script src="consultor-visitas\.js\?v=[^"]+"></script>','',s)
          s=re.sub(r'<script src="consultor-layout-clean\.js\?v=[^"]+"></script>','',s)
          s=re.sub(r'<script src="consultor-header-actions\.js\?v=[^"]+"></script>','',s)
          tags='<script src="consultor-visitas.js?v=20260909-05"></script><script src="consultor-layout-clean.js?v=20260909-01"></script><script src="consultor-header-actions.js?v=20260910-02"></script>'
          s=s.replace('</body></html>',tags+'</body></html>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Ativa links oficiais no cabecalho dos consultores' && git push)
