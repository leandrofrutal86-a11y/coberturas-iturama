name: Inject Shortcut Login
on:
  push:
    branches: [main]
    paths:
      - 'shortcut-install.js'
      - '.github/workflows/inject-shortcut-login.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject shortcut login
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src="shortcut-install\.js\?v=[^"]+"></script>','',s)
          tag='<script src="shortcut-install.js?v=20260909-login-01"></script>'
          s=s.replace('</body></html>',tag+'</body></html>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Ativa login e atalho do consultor' && git push)
