name: Inject Trio UI Fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trio-ui-fix.js'
      - '.github/workflows/inject-trio-ui-fix.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject consultant UI scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('▥ APLICATIVOS','▥ LINK DOS INCENTIVOS')
          s=s.replace('▦ APLICATIVOS','▦ LINK DOS INCENTIVOS')
          legacy=['consultor-acesso-geral','consultor-rogerio-layer-fix','consultor-rogerio-selector-fix','consultor-rogerio-ui']
          for name in legacy:
              s=re.sub(r'\s*<script\s+src=["\']'+re.escape(name)+r'\.js(?:\?[^"\']*)?["\']\s*></script>', '', s, flags=re.I)
          versions={
            'trio-ui-fix':'20260911-04',
            'consultor-visitas':'20260914-acomp-05',
            'consultor-contatos':'20260914-acomp-05',
            'b2b-dashboard-fix':'20260914-b2b-live-01',
            'consultor-pv-dia':'20260915-pv-dia-01',
            'consultor-oportunidades-dia':'20260915-op-dia-01',
            'consultor-imperdoaveis':'20260914-acomp-05',
            'consultor-imperdoaveis-ajuste':'20260914-acomp-05',
            'consultor-rogerio-ui':'20260914-rogerio-stable-02',
          }
          for name in versions:
              s=re.sub(r'\s*<script\s+src=["\']'+re.escape(name)+r'\.js(?:\?[^"\']*)?["\']\s*></script>', '', s, flags=re.I)
          tags='\n'.join(f'<script src="{name}.js?v={ver}"></script>' for name,ver in versions.items())
          pos=s.lower().rfind('</body>')
          if pos >= 0:
              s=s[:pos]+tags+'\n'+s[pos:]
          else:
              s+='\n'+tags+'\n'
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit injection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Publica acompanhamento atualizado'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
