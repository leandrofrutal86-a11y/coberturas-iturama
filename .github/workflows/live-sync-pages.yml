name: Sincronizacao automatica do site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-sync-pages
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar atualizacao automatica e olhinho da senha
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # Adiciona o botão de mostrar/ocultar senha no login, sem duplicar.
          if 'id="togglePass"' not in html:
              old = '<input id="pass" type="password" autocomplete="current-password" placeholder="Digite sua senha">'
              new = '''<div style="position:relative"><input id="pass" type="password" autocomplete="current-password" placeholder="Digite sua senha" style="padding-right:58px"><button id="togglePass" type="button" aria-label="Mostrar senha" title="Mostrar senha" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:transparent;color:#5f6875;font-size:24px;cursor:pointer;margin:0;padding:0">👁</button></div>'''
              if old not in html:
                  raise SystemExit('Campo de senha não encontrado no index.html')
              html = html.replace(old, new, 1)

          eye = r'''<script id="password-eye-v1">
          (function(){
            var b=document.getElementById('togglePass'), p=document.getElementById('pass');
            if(!b||!p)return;
            b.addEventListener('click',function(){
              var show=p.type==='password';
              p.type=show?'text':'password';
              b.textContent=show?'🙈':'👁';
              b.setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha');
              b.setAttribute('title',show?'Ocultar senha':'Mostrar senha');
            });
          })();
          </script>'''
          html = re.sub(r'<script id="password-eye-v1">.*?</script>', '', html, flags=re.S)

          live = r'''<script id="v41-live-site-sync">
          (function(){
            var lastTag=null, reloading=false;
            async function checkSite(){
              try{
                var r=await fetch(location.pathname+'?__check='+Date.now(),{method:'HEAD',cache:'no-store'});
                if(!r.ok)return;
                var tag=r.headers.get('etag')||r.headers.get('last-modified')||'';
                if(!tag)return;
                if(lastTag===null){lastTag=tag;return;}
                if(tag!==lastTag&&!reloading){reloading=true;location.reload();}
              }catch(e){}
            }
            checkSite();
            setInterval(checkSite,60000);
            document.addEventListener('visibilitychange',function(){if(!document.hidden)checkSite();});
            window.addEventListener('focus',checkSite);
          })();
          </script>'''
          html = re.sub(r'<script id="v40-live-site-sync">.*?</script>', '', html, flags=re.S)
          html = re.sub(r'<script id="v41-live-site-sync">.*?</script>', '', html, flags=re.S)
          pos = html.lower().rfind('</body>')
          if pos < 0:
              raise SystemExit('index.html sem </body>')
          html = html[:pos] + eye + '\n' + live + '\n' + html[pos:]
          p.write_text(html, encoding='utf-8')
          PY

      - name: Validar
        shell: bash
        run: |
          grep -q 'id="togglePass"' index.html
          grep -q 'id="password-eye-v1"' index.html
          grep -q 'id="v41-live-site-sync"' index.html
          grep -q 'setInterval(checkSite,60000)' index.html

      - name: Publicar ajuste
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nada a alterar.'
            exit 0
          fi
          git commit -m 'Corrigir login e adicionar olhinho na senha'
          git push
