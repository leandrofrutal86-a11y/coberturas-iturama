name: Sincronizacao automatica do site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-sync-pages
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Instalar atualizacao automatica
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          live = r'''<script id="v41-live-site-sync">
          (function(){
            var lastTag=null, reloading=false;
            async function checkSite(){
              try{
                var r=await fetch(location.pathname+'?__check='+Date.now(),{method:'HEAD',cache:'no-store'});
                if(!r.ok)return;
                var tag=r.headers.get('etag')||r.headers.get('last-modified')||'';
                if(!tag)return;
                if(lastTag===null){lastTag=tag;return;}
                if(tag!==lastTag&&!reloading){reloading=true;location.reload();}
              }catch(e){}
            }
            checkSite();
            setInterval(checkSite,60000);
            document.addEventListener('visibilitychange',function(){if(!document.hidden)checkSite();});
            window.addEventListener('focus',checkSite);
          })();
          </script>'''
          html = re.sub(r'<script id="v40-live-site-sync">.*?</script>', '', html, flags=re.S)
          html = re.sub(r'<script id="v41-live-site-sync">.*?</script>', '', html, flags=re.S)
          pos = html.lower().rfind('</body>')
          if pos < 0:
              raise SystemExit('index.html sem </body>')
          html = html[:pos] + live + '\n' + html[pos:]
          p.write_text(html, encoding='utf-8')
          PY

      - name: Validar
        shell: bash
        run: |
          grep -q 'id="v41-live-site-sync"' index.html
          grep -q 'setInterval(checkSite,60000)' index.html
          grep -q 'async function sincronizarOnline' supabase-online.js
          grep -q "cache:'no-store'" supabase-online.js

      - name: Publicar ajuste
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nada a alterar.'
            exit 0
          fi
          git commit -m 'Ativar recarga automatica do site publicado'
          git push
