name: Publicar atualizacao de vendas

on:
  push:
    paths:
      - 'data-update-20260904-*.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar vendas no HTML
        run: |
          parts=(data-update-20260904-*.txt)
          if [ ! -e "${parts[0]}" ]; then
            echo 'Nenhuma atualizacao de vendas pendente.'
            exit 0
          fi
          cat data-update-20260904-*.txt | tr -d '\n\r ' > /tmp/vendas.b64
          python - <<'PY'
          from pathlib import Path
          import base64,bz2,json,re
          index=Path('index.html')
          s=index.read_text(encoding='utf-8')
          raw=bz2.decompress(base64.b64decode(Path('/tmp/vendas.b64').read_text()))
          vendas=json.loads(raw.decode('utf-8'))
          vendas_json=json.dumps(vendas,ensure_ascii=False,separators=(',',':'))
          m=re.search(r'const DATA = (\{)',s)
          if not m: raise SystemExit('DATA nao encontrada')
          start=m.start(1)
          def matching(text,pos,op='{',cl='}'):
              depth=0; ins=False; esc=False
              for i in range(pos,len(text)):
                  c=text[i]
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                  else:
                      if c=='"': ins=True
                      elif c==op: depth+=1
                      elif c==cl:
                          depth-=1
                          if depth==0:return i
              return -1
          end=matching(s,start)
          vkey=s.find('"vendas":',start,end)
          arr_start=s.find('[',vkey,end)
          arr_end=matching(s,arr_start,'[',']')
          if vkey<0 or arr_start<0 or arr_end<0: raise SystemExit('array vendas nao encontrado')
          s=s[:arr_start]+vendas_json+s[arr_end+1:]
          s=re.sub(r'"source":"[^"]*","updatedAt":"[^"]*"','"source":"EXPORT_20260904_004542(1).XLSX","updatedAt":"2026-09-04"',s,count=1)
          s=s.replace("c.baseVendasAtualizada='EXPORT_20260902_111444.XLSX'","c.baseVendasAtualizada='EXPORT_20260904_004542(1).XLSX'")
          s=s.replace("c.source='EXPORT_20260902_111444.XLSX'","c.source='EXPORT_20260904_004542(1).XLSX'")
          s=s.replace("c.updatedAt='2026-09-02'","c.updatedAt='2026-09-04'")
          marker='id="v31-static-final-zero"'
          if marker not in s:
              final_script='''<script id="v31-static-final-zero">\n(function(){try{\n  if(typeof DATA!=="undefined" && DATA.metas){Object.keys(DATA.metas).forEach(function(k){DATA.metas[k]=0;});}\n  var K="iturama_admin_completo_v2";\n  var c=null; try{c=JSON.parse(localStorage.getItem(K)||"null");}catch(e){}\n  if(c){c.metas=c.metas||{};Object.keys(c.metas).forEach(function(k){c.metas[k]=0;});c.source="EXPORT_20260904_004542(1).XLSX";c.updatedAt="2026-09-04";c.baseVendasAtualizada="EXPORT_20260904_004542(1).XLSX";localStorage.setItem(K,JSON.stringify(c));}\n  localStorage.removeItem("iturama_metas");\n}catch(e){}})();\n</script>'''
              s=s.replace('</body>',final_script+'\n</body>',1)
          index.write_text(s,encoding='utf-8')
          print(f'Vendas atualizadas: {len(vendas)} registros')
          PY

      - name: Validar
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,bz2,json,re
          s=Path('index.html').read_text(encoding='utf-8')
          b=''.join(p.read_text() for p in sorted(Path('.').glob('data-update-20260904-*.txt')))
          raw=bz2.decompress(base64.b64decode(b))
          vendas=json.loads(raw.decode('utf-8'))
          if len(vendas)!=3962: raise SystemExit(f'Quantidade inesperada: {len(vendas)}')
          if 'EXPORT_20260904_004542(1).XLSX' not in s: raise SystemExit('fonte nao atualizada')
          if 'id="v31-static-final-zero"' not in s: raise SystemExit('zeragem final ausente')
          if 'let customMetas = {};' not in s: raise SystemExit('metas antigas podem ser usadas')
          print('OK: 3962 vendas novas, metas zeradas e versao estatica preservada')
          PY

      - name: Publicar
        run: |
          rm -f data-update-20260904-*.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html data-update-20260904-*.txt
          git diff --cached --quiet || (git commit -m 'Corrigir base de vendas e zerar metas' && git push)
