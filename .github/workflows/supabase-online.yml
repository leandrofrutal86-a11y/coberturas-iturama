name: Publicar atualizacao de vendas

on:
  push:
    paths:
      - 'data-update-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar vendas no HTML
        run: python update_sales.py
      - name: Validar JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          if 'EXPORT_20260904_004542(1).XLSX' not in s: raise SystemExit('fonte nao atualizada')
          if 'function categoryRows(rota, cat)' not in s: raise SystemExit('parametros ausentes')
          if 'id="v31-static-final-zero"' not in s: raise SystemExit('zeragem ausente')
          print('OK - pagina estatica, vendas novas, parametros preservados e metas zeradas')
          PY
      - name: Publicar
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html data-update-part-*.txt
          git diff --cached --quiet || (git commit -m 'Atualizar vendas pela nova planilha' && git push)
