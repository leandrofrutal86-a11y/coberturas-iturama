name: Integrar Supabase ao site

on:
  push:
    paths:
      - '.github/workflows/supabase-online.yml'
      - 'supabase-online.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Inserir script de sincronização
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- SUPABASE ONLINE SYNC V1 -->'

          # Remove eventual versão anterior, inclusive a primeira versão que foi
          # inserida dentro do bloco <script> por engano.
          pos = text.find(marker)
          if pos >= 0:
              end = text.find('</script>', pos)
              if end >= 0:
                  end += len('</script>')
                  text = text[:pos] + text[end:]

          # Garante que o script externo seja carregado uma única vez, no fim do body.
          tag = '<script src="./supabase-online.js"></script>'
          text = text.replace(tag, '')
          body_end = text.lower().rfind('</body>')
          if body_end < 0:
              raise SystemExit('</body> não encontrado')
          text = text[:body_end] + '\n' + marker + '\n' + tag + '\n' + text[body_end:]
          path.write_text(text, encoding='utf-8')

      - name: Publicar alteração
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Conectar site à base online do Supabase'
          git push
