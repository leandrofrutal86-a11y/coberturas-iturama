name: Atualizar site

on:
  push:
    paths:
      - '.github/workflows/supabase-online.yml'
      - 'supabase-online.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar pagina
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./supabase-online.js"></script>'
          s=s.replace(tag,'')

          # Corrige o botão de entrada do administrador para usar uma função
          # independente da ordem de carregamento dos scripts.
          s=s.replace('onclick="login()">Entrar</button>', 'onclick="window.__loginADM()">Entrar</button>', 1)

          login_fix='''\n<script>\nwindow.__loginADM=function(){\n  const pass=document.getElementById("pass");\n  const err=document.getElementById("err");\n  if(pass && typeof DATA!=="undefined" && pass.value===DATA.adminPassword){\n    if(typeof closeModal==="function") closeModal();\n    const full=document.getElementById("adminFull");\n    if(full){full.classList.add("open");document.body.classList.add("admin-open");}\n    if(typeof buildAdmin==="function") buildAdmin();\n    if(typeof window.render==="function") window.render("metas");\n    return true;\n  }\n  if(err) err.textContent="Senha incorreta.";\n  return false;\n};\n</script>\n'''
          # Remove versões anteriores da correção para não duplicar.
          import re
          s=re.sub(r'\\n<script>\\nwindow\\.__loginADM=function\\(\\)\\{.*?</script>\\n','\\n',s,flags=re.S)

          i=s.lower().rfind('</body>')
          if i<0: raise SystemExit('body missing')
          s=s[:i]+login_fix+'<!-- ONLINE DATA -->\n'+tag+'\n'+s[i:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Corrigir acesso ao administrador' && git push)
