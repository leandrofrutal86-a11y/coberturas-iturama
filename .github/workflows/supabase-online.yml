name: Atualizar site

on:
  push:
    paths:
      - '.github/workflows/supabase-online.yml'
      - 'supabase-online.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir index sem duplicar scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove qualquer versão anterior do script online para deixar uma só.
          s = re.sub(r'<script\s+src=["\']\./supabase-online\.js(?:\?[^"\']*)?["\']\s*></script>', '', s, flags=re.I)

          # Corrige o botão de entrada do administrador sem depender da ordem dos scripts.
          s = s.replace('onclick="login()">Entrar</button>', 'onclick="window.__loginADM()">Entrar</button>', 1)

          # Remove versões anteriores da correção de login.
          s = re.sub(r'<script>\s*window\.__loginADM\s*=\s*function\(\)\s*\{.*?</script>\s*', '', s, flags=re.S)

          login_fix = '''<script>
          window.__loginADM=function(){
            const pass=document.getElementById("pass");
            const err=document.getElementById("err");
            if(pass && typeof DATA!=="undefined" && pass.value===DATA.adminPassword){
              if(typeof closeModal==="function") closeModal();
              const full=document.getElementById("adminFull");
              if(full){full.classList.add("open");document.body.classList.add("admin-open");}
              if(typeof buildAdmin==="function") buildAdmin();
              if(typeof window.render==="function") window.render("metas");
              return true;
            }
            if(err) err.textContent="Senha incorreta.";
            return false;
          };
          </script>
          '''

          i = s.lower().rfind('</body>')
          if i < 0:
              raise SystemExit('body missing')
          s = s[:i] + login_fix + '<script src="./supabase-online.js?v=20260904"></script>\n' + s[i:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validar index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          n=len(re.findall(r'<script\s+src=["\']\./supabase-online\.js(?:\?[^"\']*)?["\']\s*></script>',s,re.I))
          if n != 1:
              raise SystemExit(f'supabase-online.js duplicado/ausente: {n}')
          if 'window.__loginADM=function' not in s:
              raise SystemExit('correção de login ausente')
          if 'onclick="window.__loginADM()">Entrar</button>' not in s:
              raise SystemExit('botão ADM não corrigido')
          print('OK: index validado')
          PY

      - name: Gravar correção no GitHub
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Corrigir gravação e carregamento do site' && git push)
