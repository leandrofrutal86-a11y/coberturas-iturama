name: Publicar atualizacao de vendas

on:
  push:
    paths:
      - 'data-update.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar vendas no HTML
        run: |
          if [ ! -f data-update.json ]; then
            echo 'Nenhuma atualizacao de vendas pendente.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import json, re
          index = Path('index.html')
          update = Path('data-update.json')
          s = index.read_text(encoding='utf-8')
          payload = json.loads(update.read_text(encoding='utf-8'))
          vendas = payload['vendas']
          vendas_json = json.dumps(vendas, ensure_ascii=False, separators=(',', ':'))
          m = re.search(r'const DATA = (\{)', s)
          if not m: raise SystemExit('DATA nao encontrada')
          start = m.start(1)
          def matching(text, pos, op='{', cl='}'):
              depth=0; ins=False; esc=False
              for i in range(pos,len(text)):
                  c=text[i]
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                  else:
                      if c=='"': ins=True
                      elif c==op: depth+=1
                      elif c==cl:
                          depth-=1
                          if depth==0: return i
              return -1
          end=matching(s,start)
          if end<0: raise SystemExit('fim de DATA nao encontrado')
          vkey=s.find('"vendas":',start,end)
          arr_start=s.find('[',vkey,end)
          arr_end=matching(s,arr_start,'[',']')
          if vkey<0 or arr_start<0 or arr_end<0: raise SystemExit('array vendas nao encontrado')
          s=s[:arr_start]+vendas_json+s[arr_end+1:]
          s=re.sub(r'"source":"[^"]*","updatedAt":"[^"]*"','"source":"'+payload['source']+'","updatedAt":"'+payload['updatedAt']+'"',s,count=1)
          s=s.replace("c.baseVendasAtualizada='EXPORT_20260902_111444.XLSX'","c.baseVendasAtualizada='"+payload['source']+"'")
          s=s.replace("c.source='EXPORT_20260902_111444.XLSX'","c.source='"+payload['source']+"'")
          s=s.replace("c.updatedAt='2026-09-02'","c.updatedAt='"+payload['updatedAt']+"'")
          index.write_text(s,encoding='utf-8')
          print(f'Vendas atualizadas: {len(vendas)} registros')
          PY

      - name: Validar
        run: |
          if [ ! -f data-update.json ]; then exit 0; fi
          python - <<'PY'
          from pathlib import Path
          import json
          s=Path('index.html').read_text(encoding='utf-8')
          p=json.loads(Path('data-update.json').read_text(encoding='utf-8'))
          if len(p.get('vendas',[]))==0: raise SystemExit('planilha sem vendas')
          if f'"source":"{p["source"]}"' not in s: raise SystemExit('source nao atualizado')
          if 'V31-STATIC-ZERO-METAS' not in s: raise SystemExit('metas zeradas ausentes')
          if 'let customMetas = {};' not in s: raise SystemExit('metas antigas podem ser usadas')
          print('OK: vendas novas, metas zeradas e versao estatica preservadas')
          PY

      - name: Publicar
        run: |
          if [ ! -f data-update.json ]; then exit 0; fi
          rm -f data-update.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html data-update.json
          git diff --cached --quiet || (git commit -m 'Atualizar vendas pela nova planilha' && git push)
