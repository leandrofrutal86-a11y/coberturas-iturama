name: Publicar atualizacao de vendas

on:
  push:
    paths:
      - 'data-update-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar base da nova planilha
        run: |
          git fetch origin 01351efe04b998a528172fa387d99170e43496ea --depth=1
          git checkout 01351efe04b998a528172fa387d99170e43496ea -- index.html
      - name: Aplicar parametros finais
        run: python update_sales.py
      - name: Corrigir travamento e Visao Geral
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # O observer antigo escrevia na tabela dentro do proprio callback,
          # gerando novas mutacoes em cadeia e podendo travar o navegador.
          s=re.sub(r'<script id="v32-zero-estrella-dom">.*?</script>', '', s, count=1, flags=re.S)

          # Remove qualquer versao anterior da correcao do botao.
          s=re.sub(r'<script id="v33-fix-overview-button">.*?</script>', '', s, count=1, flags=re.S)
          s=re.sub(r'<script id="v34-fix-overview-button">.*?</script>', '', s, count=1, flags=re.S)

          # O botao fica sem onclick inline e com type=button para nunca
          # submeter formulario nem depender de escopo de funcao.
          s=re.sub(r'<button class="secondary" onclick="(?:window\.__openOverview\(\)|showOverview\(\))" style="width:100%;height:100%">Visão Geral da Equipe</button>',
                   '<button id="btnOverview" class="secondary" type="button" style="width:100%;height:100%">Visão Geral da Equipe</button>', s, count=1)

          fix='''<script id="v34-fix-overview-button">
          (function(){
            function openOverview(){
              try{
                var overview=document.getElementById('overviewPanel');
                if(!overview)return false;
                document.querySelectorAll('main > .panel').forEach(function(el){el.style.display='none';});
                document.querySelectorAll('.filters,.hero,.cards').forEach(function(el){el.style.display='none';});
                overview.style.display='block';
                if(typeof window.showOverview==='function'){
                  try{window.showOverview();}catch(e){}
                }
                window.scrollTo(0,0);
                return true;
              }catch(e){return false;}
            }
            function bind(){
              var b=document.getElementById('btnOverview');
              if(!b)return;
              b.type='button';
              b.onclick=function(e){e.preventDefault();e.stopPropagation();openOverview();return false;};
            }
            bind();
            window.addEventListener('DOMContentLoaded',bind);
            window.addEventListener('load',bind);
            setTimeout(bind,100);
            setTimeout(bind,500);
            setTimeout(bind,1500);
          })();
          </script>'''
          s=s.replace('</body>',fix+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          print('OK - observer causador de travamento removido e Visao Geral corrigida')
          PY
      - name: Validar
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'const DATA = (\{)',s)
          if not m: raise SystemExit('DATA ausente')
          start=m.start(1); depth=0; ins=False; esc=False; end=-1
          for i in range(start,len(s)):
              c=s[i]
              if ins:
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c=='"': ins=False
              else:
                  if c=='"': ins=True
                  elif c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0: end=i+1; break
          d=json.loads(s[start:end])
          if len(d.get('vendas',[]))!=232: raise SystemExit(f"Base inesperada: {len(d.get('vendas',[]))}")
          if 'function categoryRows(rota, cat)' not in s: raise SystemExit('Parametros ausentes')
          if 'id="v31-static-final-zero"' not in s: raise SystemExit('Zeragem ausente')
          if 'id="v34-fix-overview-button"' not in s: raise SystemExit('Correcao da Visao Geral ausente')
          if 'v32-zero-estrella-dom' in s: raise SystemExit('Observer antigo ainda presente')
          if '#adminPanel,#modal,#adminFull,.admMenu{display:none!important}' not in s: raise SystemExit('Administrador nao esta oculto')
          if 'id="btnOverview"' not in s: raise SystemExit('Botao Visao Geral nao encontrado')
          print('OK - sem travamento, Visao Geral corrigida, 232 registros, parametros preservados e administrador oculto')
          PY
      - name: Publicar
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Corrigir travamento e botao Visao Geral' && git push)
