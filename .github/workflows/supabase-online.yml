name: Publicar atualizacao de vendas

on:
  push:
    paths:
      - 'data-update-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar base da nova planilha
        run: |
          git fetch origin 01351efe04b998a528172fa387d99170e43496ea --depth=1
          git checkout 01351efe04b998a528172fa387d99170e43496ea -- index.html
      - name: Aplicar parametros finais
        run: python update_sales.py
      - name: Validar
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'const DATA = (\{)',s)
          if not m: raise SystemExit('DATA ausente')
          start=m.start(1); depth=0; ins=False; esc=False; end=-1
          for i in range(start,len(s)):
              c=s[i]
              if ins:
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c=='"': ins=False
              else:
                  if c=='"': ins=True
                  elif c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0: end=i+1; break
          d=json.loads(s[start:end])
          if len(d.get('vendas',[]))!=232: raise SystemExit(f"Base inesperada: {len(d.get('vendas',[]))}")
          if 'function categoryRows(rota, cat)' not in s: raise SystemExit('Parametros ausentes')
          if 'id="v31-static-final-zero"' not in s: raise SystemExit('Zeragem ausente')
          if '#adminPanel,#modal,#adminFull,.admMenu{display:none!important}' not in s: raise SystemExit('Administrador nao esta oculto')
          print('OK - 232 registros da nova planilha, parametros preservados, metas zeradas e administrador oculto')
          PY
      - name: Publicar
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'Publicar vendas da nova planilha' && git push)
