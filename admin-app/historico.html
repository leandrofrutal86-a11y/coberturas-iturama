<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Histórico de Acesso • Equipe Iturama</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f4f6;color:#172534}
header{background:linear-gradient(135deg,#111,#8f0000);color:#fff;padding:15px 16px;position:sticky;top:0;z-index:3}
.top{max-width:1250px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:#ddd;margin-top:4px}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer}
.back{background:#fff;color:#172534}.danger{background:#c8161d;color:#fff}.refresh{background:#172534;color:#fff}
main{max-width:1250px;margin:auto;padding:16px}
.box{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 12px #0001}
.notice{background:#fff4e5;border-radius:10px;padding:12px;margin:10px 0 14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tableWrap{overflow:auto;border:1px solid #e1e6ea;border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:11px;border-bottom:1px solid #e6e9ec;text-align:left;white-space:nowrap}
th{background:#f6f7f8;font-size:12px;position:sticky;top:0}
.ok{color:#15803d;font-weight:900}.old{color:#7a8791}.empty{padding:24px;text-align:center;color:#667}.mobileList{display:none}.accessCard{background:#fff;border:1px solid #dfe5ea;border-radius:14px;padding:13px;box-shadow:0 2px 8px #0000000a}.accessTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.accessName{font-size:17px;font-weight:950;color:#172534}.accessRoute{display:inline-block;margin-top:5px;background:#eaf2f8;color:#24506d;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.accessNo{min-width:28px;height:28px;border-radius:999px;background:#172534;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900}.accessMeta{font-size:11px;color:#6b7883;margin-top:5px}.accessTimes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.accessTime{background:#f7f9fa;border-radius:10px;padding:9px}.accessTime b{display:block;font-size:10px;color:#6b7883;margin-bottom:4px}.accessTime strong{font-size:12px}.accessDuration{margin-top:7px;background:#fff4e5;border-radius:10px;padding:9px;font-size:12px}.accessDuration b{color:#6b7883;font-size:10px;display:block;margin-bottom:3px}
@media(max-width:650px){main{padding:10px}.box{padding:10px}h1{font-size:17px}.top{align-items:flex-start}.sub{font-size:11px}button{padding:9px 11px;font-size:12px}.tableWrap{display:none}.mobileList{display:grid;gap:9px}.notice{padding:11px}.actions button{flex:1}.accessTimes{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="top"><div><h1>🕘 Histórico de Acesso</h1><div class="sub">Equipe Iturama • página individual</div></div><button class="back" onclick="location.href='index.html'">← VOLTAR AO ADM</button></div></header>
<main><div class="box">
<div class="notice"><b id="resumo">Carregando histórico...</b><div style="font-size:12px;margin-top:4px;color:#687783">Início, fim e tempo logado de cada sessão.</div></div>
<div class="actions"><button class="refresh" onclick="carregar()">↻ ATUALIZAR</button><button class="danger" onclick="limpar()">🗑 LIMPAR REGISTROS</button></div>
<div class="tableWrap"><table><thead><tr><th>Nº</th><th>Consultor</th><th>Rota</th><th>Matrícula</th><th>Início</th><th>Fim</th><th>Tempo logado</th></tr></thead><tbody id="body"><tr><td colspan="7"><div class="empty">Carregando...</div></td></tr></tbody></table></div><div id="mobileList" class="mobileList"><div class="empty">Carregando...</div></div>
</div></main>
<script>
const project='harlrfhukjvhpufwhtep';
const ADMIN_URLS=[`https://${project}.supabase.co/functions/v1/admin-api`,`https://${project}.functions.supabase.co/admin-api`];
const ACCESS_URLS=[`https://${project}.supabase.co/functions/v1/admin-access-api`,`https://${project}.functions.supabase.co/admin-access-api`];
let TOKEN=sessionStorage.getItem('admToken')||'', HISTORY=[];
const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(v){try{return new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(v))}catch{return String(v||'')}}
function info(x){const start=new Date(x.created_at).getTime(),last=x.ended_at||x.last_seen_at||null,lastMs=last?new Date(last).getTime():NaN;const active=!x.ended_at&&Number.isFinite(lastMs)&&(Date.now()-lastMs)<=120000;if(!Number.isFinite(start))return{fim:'-',tempo:'-'};if(!Number.isFinite(lastMs))return{fim:'-',tempo:'Acesso antigo'};const end=active?Date.now():lastMs,mins=Math.max(0,Math.floor((end-start)/60000)),h=Math.floor(mins/60),m=mins%60,tempo=h?(h+'h '+String(m).padStart(2,'0')+'min'):(m+' min');return{fim:active?'EM USO':fmtDate(last),tempo:active?(tempo+' • ativo'):tempo}}
async function post(urls,payload){let last;for(const url of urls){try{const r=await fetch(url+'?v='+Date.now(),{method:'POST',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8','Accept':'application/json'},body:JSON.stringify(payload)});const j=await r.json().catch(()=>({}));if(r.ok&&!j.error)return j;throw Error(j.error||('Erro '+r.status))}catch(e){last=e}}throw last||Error('Falha de conexão')}
function render(){const body=document.getElementById('body'),mobile=document.getElementById('mobileList'),resumo=document.getElementById('resumo'),users=new Set(HISTORY.map(x=>x.matricula)).size;resumo.textContent=HISTORY.length?(HISTORY.length+' sessões registradas • '+users+' usuário(s)'):'Nenhum acesso registrado ainda.';const name=x=>String(x.nome||'').trim()||('Matrícula '+String(x.matricula||'-'));body.innerHTML=HISTORY.length?HISTORY.map((x,i)=>{const s=info(x);return '<tr><td>'+(i+1)+'</td><td><b>'+E(name(x))+'</b></td><td><b>'+E(x.rota||'-')+'</b></td><td>'+E(x.matricula||'-')+'</td><td>'+E(fmtDate(x.created_at))+'</td><td>'+(s.fim==='EM USO'?'<span class="ok">EM USO</span>':E(s.fim))+'</td><td><b>'+E(s.tempo)+'</b></td></tr>'}).join(''):'<tr><td colspan="7"><div class="empty">Nenhum registro de acesso.</div></td></tr>';if(mobile)mobile.innerHTML=HISTORY.length?HISTORY.map((x,i)=>{const s=info(x);return '<article class="accessCard"><div class="accessTop"><div><div class="accessName">'+E(name(x))+'</div><span class="accessRoute">Rota '+E(x.rota||'-')+'</span><div class="accessMeta">Matrícula: <b>'+E(x.matricula||'-')+'</b></div></div><span class="accessNo">'+(i+1)+'</span></div><div class="accessTimes"><div class="accessTime"><b>INÍCIO</b><strong>'+E(fmtDate(x.created_at))+'</strong></div><div class="accessTime"><b>FIM</b><strong>'+(s.fim==='EM USO'?'<span class="ok">EM USO</span>':E(s.fim))+'</strong></div></div><div class="accessDuration"><b>TEMPO LOGADO</b><strong>'+E(s.tempo)+'</strong></div></article>'}).join(''):'<div class="empty">Nenhum registro de acesso.</div>'}
async function carregar(){if(!TOKEN){location.href='index.html';return}document.getElementById('resumo').textContent='Atualizando histórico...';try{const j=await post(ADMIN_URLS,{action:'admin_config',token:TOKEN});HISTORY=j.historico_acessos||[];render()}catch(e){if(/sessão|senha|inválida/i.test(e.message)){sessionStorage.removeItem('admToken');location.href='index.html';return}document.getElementById('resumo').textContent='Erro ao carregar: '+e.message}}
async function limpar(){if(!confirm('Deseja apagar todos os registros do histórico de acesso? Esta ação não pode ser desfeita.'))return;document.getElementById('resumo').textContent='Limpando histórico...';try{await post(ACCESS_URLS,{action:'clear_login_history',token:TOKEN});HISTORY=[];render()}catch(e){document.getElementById('resumo').textContent='Erro ao limpar: '+e.message}}
carregar();setInterval(()=>{if(!document.hidden)carregar()},30000);
</script>
</body></html>
